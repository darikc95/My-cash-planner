name: template
description: Flutter стартовый шаблон — Clean Architecture, BLoC, Drift, GoRouter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  go_router: ^14.2.7

  dio: ^5.7.0

  fl_chart: ^0.69.0

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_timezone: ^4.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12
  mocktail: ^1.0.4
  bloc_test: ^9.1.7
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - env/rapidapi.json
    - .env/rapidapi.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"